name: Law.AI CI & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify zero hardcoded secrets in repository
        run: |
          ! grep -rnE "(AIza[0-9A-Za-z-_]{35}|sk-[a-zA-Z0-9]{32,})" src/ test/ docs/

      - name: Build (TypeScript strict)
        run: npm run build

      - name: Run Automated Multi-Tenant Isolation, RBAC, MCP and End-to-End Tests
        run: npm test
